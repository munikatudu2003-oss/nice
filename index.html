<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>贪吃蛇游戏</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, #1e293b, #020617);
      color: #f8fafc;
    }
    .game-wrap {
      width: min(92vw, 520px);
      background: rgba(15, 23, 42, 0.86);
      border: 1px solid rgba(148, 163, 184, 0.3);
      border-radius: 16px;
      box-shadow: 0 20px 45px rgba(2, 6, 23, 0.5);
      padding: 18px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      gap: 10px;
    }
    .title {
      margin: 0;
      font-size: 1.35rem;
    }
    .meta {
      font-size: 0.96rem;
      color: #cbd5e1;
    }
    canvas {
      width: 100%;
      aspect-ratio: 1;
      display: block;
      border-radius: 10px;
      background: #0f172a;
      border: 1px solid rgba(148, 163, 184, 0.35);
    }
    .panel {
      margin-top: 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
    }
    button {
      border: 0;
      background: #16a34a;
      color: #f0fdf4;
      font-weight: 600;
      border-radius: 10px;
      padding: 8px 14px;
      cursor: pointer;
    }
    button:hover { background: #22c55e; }
    .tip {
      margin: 0;
      color: #93c5fd;
      font-size: 0.9rem;
    }
    .status {
      color: #facc15;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <section class="game-wrap" aria-label="贪吃蛇游戏">
    <header class="header">
      <h1 class="title">🐍 贪吃蛇</h1>
      <div class="meta">得分：<span id="score">0</span></div>
    </header>
    <canvas id="board" width="480" height="480"></canvas>
    <div class="panel">
      <button id="restart" type="button">重新开始</button>
      <p class="tip">方向键 / WASD 控制移动，吃到红色食物会加分。</p>
      <span class="status" id="status"></span>
    </div>
  </section>

  <script>
    const canvas = document.getElementById('board');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const statusEl = document.getElementById('status');
    const restartBtn = document.getElementById('restart');

    const gridSize = 24;
    const tileSize = canvas.width / gridSize;

    const directionMap = {
      ArrowUp: { x: 0, y: -1 },
      ArrowDown: { x: 0, y: 1 },
      ArrowLeft: { x: -1, y: 0 },
      ArrowRight: { x: 1, y: 0 },
      w: { x: 0, y: -1 },
      s: { x: 0, y: 1 },
      a: { x: -1, y: 0 },
      d: { x: 1, y: 0 },
      W: { x: 0, y: -1 },
      S: { x: 0, y: 1 },
      A: { x: -1, y: 0 },
      D: { x: 1, y: 0 },
    };

    let snake;
    let velocity;
    let nextVelocity;
    let food;
    let score;
    let gameOver;
    let gameTimer;

    function randomFood() {
      while (true) {
        const pos = {
          x: Math.floor(Math.random() * gridSize),
          y: Math.floor(Math.random() * gridSize),
        };
        const onSnake = snake.some((part) => part.x === pos.x && part.y === pos.y);
        if (!onSnake) return pos;
      }
    }

    function resetGame() {
      snake = [
        { x: 12, y: 12 },
        { x: 11, y: 12 },
        { x: 10, y: 12 },
      ];
      velocity = { x: 1, y: 0 };
      nextVelocity = { x: 1, y: 0 };
      food = randomFood();
      score = 0;
      gameOver = false;
      scoreEl.textContent = String(score);
      statusEl.textContent = '';
      clearInterval(gameTimer);
      gameTimer = setInterval(tick, 110);
      draw();
    }

    function isReverse(newVel) {
      return newVel.x === -velocity.x && newVel.y === -velocity.y;
    }

    function tick() {
      if (gameOver) return;

      velocity = nextVelocity;
      const head = {
        x: snake[0].x + velocity.x,
        y: snake[0].y + velocity.y,
      };

      const hitWall = head.x < 0 || head.y < 0 || head.x >= gridSize || head.y >= gridSize;
      const hitSelf = snake.some((part) => part.x === head.x && part.y === head.y);
      if (hitWall || hitSelf) {
        gameOver = true;
        clearInterval(gameTimer);
        statusEl.textContent = '游戏结束，点击“重新开始”再来一局！';
        draw();
        return;
      }

      snake.unshift(head);

      if (head.x === food.x && head.y === food.y) {
        score += 10;
        scoreEl.textContent = String(score);
        food = randomFood();
      } else {
        snake.pop();
      }

      draw();
    }

    function drawCell(pos, color, radius = 4) {
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.roundRect(
        pos.x * tileSize + 1,
        pos.y * tileSize + 1,
        tileSize - 2,
        tileSize - 2,
        radius
      );
      ctx.fill();
    }

    function drawGrid() {
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.strokeStyle = 'rgba(148, 163, 184, 0.10)';
      ctx.lineWidth = 1;
      for (let i = 1; i < gridSize; i += 1) {
        const p = i * tileSize;
        ctx.beginPath();
        ctx.moveTo(p, 0);
        ctx.lineTo(p, canvas.height);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(0, p);
        ctx.lineTo(canvas.width, p);
        ctx.stroke();
      }
    }

    function draw() {
      drawGrid();
      drawCell(food, '#ef4444', 8);
      snake.forEach((part, index) => {
        drawCell(part, index === 0 ? '#22c55e' : '#16a34a', index === 0 ? 7 : 4);
      });
    }

    document.addEventListener('keydown', (event) => {
      const newVel = directionMap[event.key];
      if (!newVel || gameOver) return;
      if (!isReverse(newVel)) {
        nextVelocity = newVel;
      }
    });

    restartBtn.addEventListener('click', resetGame);

    resetGame();
  </script>
</body>
</html>
